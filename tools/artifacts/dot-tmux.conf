set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on

bind-key Z run-shell "~/.local/bin/tmux-zen.sh"
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Auto-start zen mode on new sessions and windows
set-hook -g after-new-session "run-shell '~/.local/bin/tmux-zen.sh'"
set-hook -g after-new-window "run-shell '~/.local/bin/tmux-zen.sh'"

